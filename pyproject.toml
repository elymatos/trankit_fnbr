[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.9"
packages = ["trankit_fnbr"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["trankit", "trankit.*"]
follow_imports = "skip"
ignore_missing_imports = true
